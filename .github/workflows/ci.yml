name: CI

on:
  push:
    branches:
      - feature/bundle-0-bootstrap
      - "feature/bundle-*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q api core services data workers

      - name: Critical lint gate
        run: python -m ruff check . --select E9,F63,F7,F82

      - name: Test
        env:
          APPLAYLIST_ENV: test
        run: |
          mkdir -p artifacts
          set -o pipefail
          python -m pytest -q \
            --junitxml="artifacts/junit-${{ matrix.python-version }}.xml" \
            2>&1 | tee "artifacts/pytest-${{ matrix.python-version }}.log"

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-python-${{ matrix.python-version }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
