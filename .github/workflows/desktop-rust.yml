name: Desktop Rust

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-rust.yml"
      - "src-tauri/**"
      - "desktop/host-proof/**"
      - "tests/test_desktop_renderer_contract.py"
  push:
    branches:
      - "feature/bundle-*"
    paths:
      - ".github/workflows/desktop-rust.yml"
      - "src-tauri/**"
      - "desktop/host-proof/**"
      - "tests/test_desktop_renderer_contract.py"

permissions:
  contents: read

concurrency:
  group: desktop-rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-host:
    name: macOS / Rust 1.88.0
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup override set 1.88.0
          rustc --version
          cargo --version

      - name: Rustfmt check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Cargo check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Cargo test
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
