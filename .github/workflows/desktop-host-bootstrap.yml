name: Desktop Host Bootstrap

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-host-bootstrap.yml"
      - "frontend/desktop/**"
      - "desktop/tauri/**"
  push:
    branches:
      - "feature/bundle-48-tauri-host-proof"

permissions:
  contents: write

concurrency:
  group: desktop-host-bootstrap-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  host-proof:
    name: ${{ matrix.os }} host proof
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            wget

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Recreate bootstrap lockfiles from pinned manifests
        shell: bash
        run: |
          set -euo pipefail
          rm -f frontend/desktop/package-lock.json
          rm -f desktop/tauri/Cargo.lock
          npm install --ignore-scripts --prefix frontend/desktop
          cargo generate-lockfile --manifest-path desktop/tauri/Cargo.toml

      - name: Materialize and validate desktop icon
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          from pathlib import Path

          source = Path("desktop/tauri/icons/icon.png.base64")
          target = Path("desktop/tauri/icons/icon.png")
          encoded = source.read_text(encoding="ascii").strip()
          payload = base64.b64decode(encoded, validate=True)
          if not payload.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("desktop icon source did not decode to PNG")
          if len(payload) < 1024:
              raise SystemExit("desktop icon payload is unexpectedly small")
          target.write_bytes(payload)
          PY
          file desktop/tauri/icons/icon.png

      - name: Frontend type and security checks
        working-directory: frontend/desktop
        run: |
          npm run check
          npm run security:contract
          npm run build

      - name: Apply official Rust bootstrap formatting
        run: cargo fmt --manifest-path desktop/tauri/Cargo.toml

      - name: Rust clippy gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/desktop-host
          cargo clippy \
            --manifest-path desktop/tauri/Cargo.toml \
            --all-targets \
            --locked \
            -- \
            -D warnings \
            2>&1 | tee "artifacts/desktop-host/clippy-${RUNNER_OS}.log"

      - name: Rust unit tests
        run: cargo test --manifest-path desktop/tauri/Cargo.toml --locked

      - name: Rust host compile proof
        run: cargo build --manifest-path desktop/tauri/Cargo.toml --locked --release

      - name: macOS Tauri app bundle proof
        if: runner.os == 'macOS'
        working-directory: desktop/tauri
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../artifacts/desktop-host
          ../../frontend/desktop/node_modules/.bin/tauri \
            build \
            --config tauri.conf.json \
            --bundles app \
            2>&1 | tee "../../artifacts/desktop-host/tauri-bundle-macOS.log"

      - name: Record toolchain and artifact evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/desktop-host/formatted-rust
          cp desktop/tauri/src/lib.rs artifacts/desktop-host/formatted-rust/lib.rs
          cp desktop/tauri/src/main.rs artifacts/desktop-host/formatted-rust/main.rs
          RUSTC_VERSION="$(rustc --version)"
          CARGO_VERSION="$(cargo --version)"
          NODE_VERSION="$(node --version)"
          NPM_VERSION="$(npm --version)"
          HOST_BINARY="desktop/tauri/target/release/applaylist-desktop"
          test -f "$HOST_BINARY"
          HOST_BYTES="$(wc -c < "$HOST_BINARY" | tr -d ' ')"
          APP_BYTES=0
          if [ "${RUNNER_OS}" = "macOS" ]; then
            APP_PATH="desktop/tauri/target/release/bundle/macos/APPLAYLIST.app"
            test -d "$APP_PATH"
            APP_BYTES="$(du -sk "$APP_PATH" | awk '{print $1 * 1024}')"
          fi
          cat > "artifacts/desktop-host/evidence-${RUNNER_OS}.json" <<EOF
          {
            "schema_version": "applaylist-desktop-host-bootstrap-v1",
            "runner_os": "${RUNNER_OS}",
            "rustc": "${RUSTC_VERSION}",
            "cargo": "${CARGO_VERSION}",
            "node": "${NODE_VERSION}",
            "npm": "${NPM_VERSION}",
            "host_binary_bytes": ${HOST_BYTES},
            "app_bundle_bytes": ${APP_BYTES},
            "status": "pass"
          }
          EOF

      - name: Persist generated lockfiles and icon
        if: runner.os == 'macOS' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/desktop/package-lock.json \
            desktop/tauri/Cargo.lock \
            desktop/tauri/icons/icon.png \
            desktop/tauri/src/lib.rs \
            desktop/tauri/src/main.rs
          if git diff --cached --quiet; then
            echo "No generated desktop artifacts changed"
          else
            git commit -m "Bundle 48B: lock desktop host dependency graph"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload lockfiles and host proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-host-bootstrap-${{ runner.os }}
          path: |
            frontend/desktop/package-lock.json
            desktop/tauri/Cargo.lock
            desktop/tauri/icons/icon.png
            desktop/tauri/target/release/applaylist-desktop
            desktop/tauri/target/release/bundle/macos/APPLAYLIST.app
            desktop/tauri/src/lib.rs
            desktop/tauri/src/main.rs
            artifacts/desktop-host/
          if-no-files-found: warn
          retention-days: 14
