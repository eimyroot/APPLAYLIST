name: Desktop Host Locked Proof

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-host-bootstrap.yml"
      - "frontend/desktop/**"
      - "desktop/tauri/**"
  push:
    branches:
      - "feature/bundle-0-bootstrap"
    paths:
      - ".github/workflows/desktop-host-bootstrap.yml"
      - "frontend/desktop/**"
      - "desktop/tauri/**"

permissions:
  contents: read

concurrency:
  group: desktop-host-locked-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-proof:
    name: ${{ matrix.os }} locked host proof
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            wget

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/desktop/package-lock.json

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify committed desktop inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s frontend/desktop/package-lock.json
          test -s desktop/tauri/Cargo.lock
          test -s desktop/tauri/icons/icon.png
          ! grep -Fxq "placeholder" frontend/desktop/package-lock.json
          ! grep -Fxq "placeholder" desktop/tauri/Cargo.lock
          python3 - <<'PY'
          from __future__ import annotations

          import struct
          from pathlib import Path

          payload = Path("desktop/tauri/icons/icon.png").read_bytes()
          if not payload.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("desktop icon is not a PNG")
          if len(payload) < 1024:
              raise SystemExit("desktop icon payload is unexpectedly small")
          width, height = struct.unpack(">II", payload[16:24])
          if (width, height) != (512, 512):
              raise SystemExit(f"desktop icon must be 512x512, got {width}x{height}")
          PY
          file desktop/tauri/icons/icon.png

      - name: Install exact frontend graph
        working-directory: frontend/desktop
        run: npm ci --ignore-scripts

      - name: Frontend type and security checks
        working-directory: frontend/desktop
        run: |
          npm run check
          npm run security:contract
          npm run build

      - name: Rust formatting gate
        run: cargo fmt --manifest-path desktop/tauri/Cargo.toml --check

      - name: Rust clippy gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/desktop-host
          cargo clippy \
            --manifest-path desktop/tauri/Cargo.toml \
            --all-targets \
            --locked \
            -- \
            -D warnings \
            2>&1 | tee "artifacts/desktop-host/clippy-${RUNNER_OS}.log"

      - name: Rust unit tests
        run: cargo test --manifest-path desktop/tauri/Cargo.toml --locked

      - name: Rust host release proof
        run: cargo build --manifest-path desktop/tauri/Cargo.toml --locked --release

      - name: macOS Tauri app bundle proof
        if: runner.os == 'macOS'
        working-directory: desktop/tauri
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../artifacts/desktop-host
          ../../frontend/desktop/node_modules/.bin/tauri \
            build \
            --config tauri.conf.json \
            --bundles app \
            2>&1 | tee "../../artifacts/desktop-host/tauri-bundle-macOS.log"

      - name: Record locked proof evidence
        shell: bash
        run: |
          set -euo pipefail
          RUSTC_VERSION="$(rustc --version)"
          CARGO_VERSION="$(cargo --version)"
          NODE_VERSION="$(node --version)"
          NPM_VERSION="$(npm --version)"
          HOST_BINARY="desktop/tauri/target/release/applaylist-desktop"
          test -f "$HOST_BINARY"
          HOST_BYTES="$(wc -c < "$HOST_BINARY" | tr -d ' ')"
          APP_BYTES=0
          if [ "${RUNNER_OS}" = "macOS" ]; then
            APP_PATH="desktop/tauri/target/release/bundle/macos/APPLAYLIST.app"
            test -d "$APP_PATH"
            APP_BYTES="$(du -sk "$APP_PATH" | awk '{print $1 * 1024}')"
          fi
          cat > "artifacts/desktop-host/evidence-${RUNNER_OS}.json" <<EOF
          {
            "schema_version": "applaylist-desktop-host-locked-v1",
            "runner_os": "${RUNNER_OS}",
            "rustc": "${RUSTC_VERSION}",
            "cargo": "${CARGO_VERSION}",
            "node": "${NODE_VERSION}",
            "npm": "${NPM_VERSION}",
            "host_binary_bytes": ${HOST_BYTES},
            "app_bundle_bytes": ${APP_BYTES},
            "dependency_graph": "locked",
            "status": "pass"
          }
          EOF

      - name: Verify source tree remained immutable
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            frontend/desktop/package-lock.json \
            desktop/tauri/Cargo.lock \
            desktop/tauri/icons/icon.png \
            desktop/tauri/src

      - name: Upload locked host proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-host-locked-${{ runner.os }}
          path: |
            desktop/tauri/target/release/applaylist-desktop
            desktop/tauri/target/release/bundle/macos/APPLAYLIST.app
            artifacts/desktop-host/
          if-no-files-found: warn
          retention-days: 14
