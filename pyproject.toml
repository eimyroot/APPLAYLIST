[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "applaylist"
version = "0.1.0"
description = "APPLAYLIST — AI-powered DJ playlist operating system"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.11.0",
  "librosa>=0.10,<0.11",
  "soundfile>=0.12,<1.0",
  "scipy>=1.10,<1.14",
  "numpy>=1.24,<2.0",
  "tinytag==2.2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.6,<1.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "core*", "services*", "data*", "workers*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
