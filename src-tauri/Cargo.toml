[package]
name = "applaylist-desktop-host"
version = "0.1.0"
description = "Minimal APPLAYLIST Tauri host and native library-root capability boundary"
edition = "2021"
rust-version = "1.88.0"
publish = false

[lib]
name = "applaylist_desktop_host"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
uuid = { version = "=1.24.0", features = ["v4"] }
